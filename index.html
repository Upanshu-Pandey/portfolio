<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Upanshu Pandey · Interactive Portfolio</title>
    <meta name="description" content="Upanshu Pandey: ERP Consultant and Full-Stack Developer (Business Central, .NET, React, ClickHouse) from Kathmandu. Explore his projects in a handheld-RPG-style pixel town, or open the résumé instantly." />
    <meta property="og:title" content="Upanshu Pandey · Interactive Portfolio" />
    <meta property="og:description" content="ERP Consultant & Full-Stack Developer. Explore projects in a retro pixel-art town." />
    <meta name="theme-color" content="#141c38" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <!-- Critical CSS: applies before the main stylesheet loads, so HUD/touch buttons never flash as raw HTML -->
    <style>
      html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; }
      [hidden] { display: none !important; }
      body:not(.playing) #hud, body:not(.playing) #touch, body.booting #area-banner { display: none; }
    </style>
  </head>
  <body class="booting">
    <main id="screen">
      <canvas id="game" aria-label="Pixel-art town you can explore"></canvas>
      <div id="fade"></div>
      <div id="area-banner" aria-live="polite"></div>

      <div id="hud">
        <button id="sound-btn" type="button" aria-label="Toggle sound">♪ ON</button>
        <button id="menu-btn" type="button" aria-label="Open menu (Escape)">MENU <kbd>ESC</kbd></button>
      </div>

      <div id="dialogue" class="box" hidden role="status" aria-live="polite">
        <p id="dialogue-text"></p>
        <span id="dialogue-arrow" aria-hidden="true">▼</span>
      </div>
      <div id="choice" class="box" hidden role="menu"></div>
      <nav id="start-menu" class="box" hidden aria-label="Menu"></nav>
      <div id="menu-hint" class="box" hidden></div>

      <section id="title" hidden>
        <div class="title-logo">
          <span class="title-top">UPANSHU</span>
          <span class="title-main">PANDEY</span>
        </div>
        <p class="title-sub">ERP Consultant · Full-Stack Developer</p>
        <button id="title-start" type="button" class="blink">
          <span class="on-keys">PRESS ENTER</span><span class="on-touch">TAP TO START</span>
        </button>
        <button id="title-resume" type="button">In a hurry? Open the résumé →</button>
        <p class="title-keys">Arrows / WASD to move · Shift to run · Space to talk · Esc for menu</p>
      </section>

      <div id="touch" aria-hidden="true">
        <div id="dpad"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span></div>
        <button type="button" data-btn="start" class="pill">MENU</button>
        <div class="ab">
          <button type="button" data-btn="b" class="round b">B</button>
          <button type="button" data-btn="a" class="round a">A</button>
        </div>
      </div>
    </main>

    <div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <article class="panel-card">
        <header class="panel-bar">
          <h1 id="panel-title"></h1>
          <button id="panel-close" type="button" aria-label="Close">✕ <kbd>ESC</kbd></button>
        </header>
        <div id="panel-body"></div>
        <footer class="panel-hint">↑↓ scroll/select · A select · B / ESC back</footer>
      </article>
    </div>

    <noscript>
      <div class="noscript">
        <h1>Upanshu Pandey</h1>
        <p>ERP Consultant &amp; Full-Stack Developer · Kathmandu, Nepal · Open to new roles</p>
        <p>This portfolio is a small game and needs JavaScript. Here are the essentials:</p>
        <ul>
          <li>Email: <a href="mailto:upanshupandey@gmail.com">upanshupandey@gmail.com</a></li>
          <li>LinkedIn: <a href="https://www.linkedin.com/in/upanshu-pandey-48a48b1a4/">upanshu-pandey</a></li>
          <li><a href="./assets/resume/upanshu-pandey-cv.pdf">Download CV (PDF)</a></li>
        </ul>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
